name: Build 截图猫
on:
  push:
    branches: ['main', 'feat/**']
    tags: ['v*']
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    name: Interface and clipboard tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: interface-test-results
          path: test-results/
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: screenshot-cat-windows-x64
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            artifact: screenshot-cat-macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            artifact: screenshot-cat-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        id: ffmpeg
        with:
          path: |
            src-tauri/binaries/ffmpeg-*
            src-tauri/binaries/BUILD-INFO.txt
            src-tauri/binaries/licenses/
          key: ffmpeg-8.0-${{ matrix.target }}-${{ hashFiles('scripts/build-ffmpeg.sh', 'scripts/prepare-ffmpeg.mjs') }}
      - name: Install NASM for macOS Intel
        if: matrix.target == 'x86_64-apple-darwin' && steps.ffmpeg.outputs.cache-hit != 'true'
        run: command -v nasm || brew install nasm
      - name: Build bundled FFmpeg on macOS
        if: runner.os == 'macOS' && steps.ffmpeg.outputs.cache-hit != 'true'
        run: pnpm prepare:ffmpeg
      - name: Prepare Windows C toolchain
        if: runner.os == 'Windows' && steps.ffmpeg.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            diffutils
            tar
            xz
            nasm
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
      - name: Build bundled FFmpeg on Windows
        if: runner.os == 'Windows' && steps.ffmpeg.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: sh scripts/build-ffmpeg.sh
      - name: Stage Windows sidecar
        if: runner.os == 'Windows' && steps.ffmpeg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $env:FFMPEG_PATH = (Resolve-Path artifacts/ffmpeg-build/ffmpeg.exe).Path
          pnpm prepare:ffmpeg
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Rust lint
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Build installable application
        run: pnpm exec tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Package macOS application ZIP
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/${{ matrix.target }}/release/bundle/macos/截图猫.app" "release/${{ matrix.artifact }}.zip"
      - name: Add FFmpeg license, exact source and build instructions
        shell: bash
        run: |
          mkdir -p release
          cp LICENSE THIRD_PARTY_NOTICES.md scripts/build-ffmpeg.sh release/
          cp src-tauri/binaries/BUILD-INFO.txt release/${{ matrix.artifact }}-FFmpeg-BUILD-INFO.txt
          cp src-tauri/binaries/licenses/FFmpeg-LGPL-2.1.txt release/
          curl --fail --location --retry 3 https://ffmpeg.org/releases/ffmpeg-8.0.tar.xz -o release/ffmpeg-8.0-source.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            release/*
  release:
    name: Publish tagged release
    needs: [frontend, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Publish installers, source and notices
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p publish
          for artifact in release-artifacts/screenshot-cat-*; do
            case "$artifact" in
              *-windows-x64) extension=exe ;;
              *-macos-*) extension=dmg ;;
            esac
            mapfile -d '' installers < <(find "$artifact" -type f -name "*.$extension" -print0)
            test "${#installers[@]}" -eq 1
            cp "${installers[0]}" "publish/$(basename "$artifact").$extension"
          done
          test -f publish/screenshot-cat-windows-x64.exe
          test -f publish/screenshot-cat-macos-arm64.dmg
          test -f publish/screenshot-cat-macos-x64.dmg
          find release-artifacts -type f \( -name '*.zip' -o -name 'ffmpeg-8.0-source.tar.xz' -o -name 'FFmpeg-LGPL-2.1.txt' -o -name '*-FFmpeg-BUILD-INFO.txt' -o -name 'THIRD_PARTY_NOTICES.md' -o -name 'LICENSE' -o -name 'build-ffmpeg.sh' \) -exec cp {} publish/ \;
          gh release create "$GITHUB_REF_NAME" publish/* --verify-tag --generate-notes --title "截图猫 $GITHUB_REF_NAME"
